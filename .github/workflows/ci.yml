name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.gradle*'
      - '.github/workflows/ci.yml'
      - 'gradle.properties'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.properties'
      - 'src/**'
      - 'buildSrc/**'
      - 'gradle/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.gradle*'
      - '.github/workflows/ci.yml'
      - 'gradle.properties'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.properties'
      - 'src/**'
      - 'buildSrc/**'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.build-cache=true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run all tests
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 30

