name: 'kigawa-net App Token'
description: >-
  Mints a short-lived installation access token for the "kigawa-net" GitHub App
  (app_id 4316503, contents:write) by calling admin-panel's GitHub App broker
  endpoint. The App's private key lives only on admin-panel; this action proves
  its identity with its own GitHub Actions OIDC token instead of a shared
  secret. Flow: custom action -> admin-panel (verifies OIDC) -> GitHub App.
inputs:
  owner:
    description: 'GitHub org/user to scope the token to.'
    required: false
    default: 'kigawa-net'
  repositories:
    description: >-
      Newline- or comma-separated repo names (without owner) to scope the
      token to. Defaults to every repo the App can access for the owner.
    required: false
  permissions:
    description: >-
      JSON object of a permission subset to request, e.g. {"contents":"write"}.
      Defaults to the App's full granted permissions.
    required: false
  admin-panel-url:
    description: 'Base URL of the admin-panel API.'
    required: false
    default: 'https://admin.kigawa.net/api'
  oidc-audience:
    description: >-
      Audience to request for this action's own OIDC token. Must match
      admin-panel's configured ADMIN_PANEL_ACTIONS_AUDIENCE.
    required: false
    default: 'https://admin.kigawa.net'
outputs:
  token:
    description: 'Short-lived installation access token'
    value: ${{ steps.request-token.outputs.token }}
runs:
  using: 'composite'
  steps:
    - id: request-token
      shell: bash
      env:
        # Routed through env: rather than interpolated directly into the script text below,
        # since a raw ${{ inputs.x }} substitution breaks (or is injectable) whenever the value
        # itself contains shell-meaningful characters — e.g. `permissions` is a JSON object full
        # of double quotes, which corrupted the double-quoted `perms_json="${{ inputs.permissions }}"`
        # form this used to take.
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPOSITORIES: ${{ inputs.repositories }}
        INPUT_PERMISSIONS: ${{ inputs.permissions }}
        INPUT_ADMIN_PANEL_URL: ${{ inputs.admin-panel-url }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
      run: |
        set -euo pipefail

        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::No OIDC request token/URL available. Add 'permissions: id-token: write' to the calling job."
          exit 1
        fi

        oidc_token=$(curl -sS -f -G \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          --data-urlencode "audience=$INPUT_OIDC_AUDIENCE" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')

        if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
          echo "::error::failed to mint an OIDC token"
          exit 1
        fi
        echo "::add-mask::$oidc_token"

        repos_json="null"
        if [ -n "$INPUT_REPOSITORIES" ]; then
          repos_json=$(printf '%s' "$INPUT_REPOSITORIES" | tr ',\n' '\n' | sed '/^[[:space:]]*$/d' | jq -R . | jq -s .)
        fi

        perms_json="$INPUT_PERMISSIONS"
        if [ -z "$perms_json" ]; then
          perms_json="null"
        fi

        body=$(jq -n \
          --arg owner "$INPUT_OWNER" \
          --argjson repositories "$repos_json" \
          --argjson permissions "$perms_json" \
          '{owner: $owner, repositories: $repositories, permissions: $permissions}')

        response=$(curl -sS -f -X POST "$INPUT_ADMIN_PANEL_URL/github-app/ci-token" \
          -H "Authorization: Bearer $oidc_token" \
          -H "Content-Type: application/json" \
          -d "$body")

        token=$(printf '%s' "$response" | jq -r .token)
        if [ -z "$token" ] || [ "$token" = "null" ]; then
          echo "::error::admin-panel did not return a token"
          exit 1
        fi

        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
